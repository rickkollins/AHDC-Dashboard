<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHDC Engagements</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
  /* ============================= TOKENS ============================= */
  :root{
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;

    --surface-0:#F5F6FB; --surface-1:#FFFFFF; --surface-2:#ECEFF8; --surface-3:#F0F2FA;
    --border:#DEE2EF; --border-strong:#C7CCE2;
    --ink:#171B2E; --ink-muted:#565F7D; --ink-faint:#8891AC;
    --accent:#4453D8; --accent-strong:#313FC2; --accent-soft:rgba(68,83,216,0.10); --on-accent:#FFFFFF;

    --good:#1F9D63; --good-soft:rgba(31,157,99,0.12);
    --warn:#B8790F; --warn-soft:rgba(184,121,15,0.14);
    --crit:#C7434B; --crit-soft:rgba(199,67,75,0.12);
    --complete:#5C6784; --complete-soft:rgba(92,103,132,0.12);
    --notstarted:#69738F; --notstarted-soft:rgba(105,115,143,0.16);

    --shadow-sm:0 1px 2px rgba(23,27,46,0.07);
    --shadow-md:0 8px 24px rgba(23,27,46,0.10);
    --shadow-lg:0 24px 64px rgba(23,27,46,0.20);
    --row-stripe:rgba(23,27,46,0.022);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-0:#0A0E1A; --surface-1:#121A2C; --surface-2:#1B2740; --surface-3:#1F2C48;
      --border:#26324D; --border-strong:#34405E;
      --ink:#E9ECF6; --ink-muted:#94A0BD; --ink-faint:#5E6A87;
      --accent:#7C89F5; --accent-strong:#98A3F8; --accent-soft:rgba(124,137,245,0.18); --on-accent:#0B0F1F;
      --good:#34D399; --good-soft:rgba(52,211,153,0.14);
      --warn:#E8A33D; --warn-soft:rgba(232,163,61,0.16);
      --crit:#E2555A; --crit-soft:rgba(226,85,90,0.16);
      --complete:#8B96AC; --complete-soft:rgba(139,150,172,0.16);
      --notstarted:#5A6584; --notstarted-soft:rgba(90,101,132,0.20);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.35); --shadow-md:0 8px 24px rgba(0,0,0,0.4); --shadow-lg:0 24px 64px rgba(0,0,0,0.55);
      --row-stripe:rgba(255,255,255,0.028);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --surface-0:#0A0E1A; --surface-1:#121A2C; --surface-2:#1B2740; --surface-3:#1F2C48;
    --border:#26324D; --border-strong:#34405E;
    --ink:#E9ECF6; --ink-muted:#94A0BD; --ink-faint:#5E6A87;
    --accent:#7C89F5; --accent-strong:#98A3F8; --accent-soft:rgba(124,137,245,0.18); --on-accent:#0B0F1F;
    --good:#34D399; --good-soft:rgba(52,211,153,0.14);
    --warn:#E8A33D; --warn-soft:rgba(232,163,61,0.16);
    --crit:#E2555A; --crit-soft:rgba(226,85,90,0.16);
    --complete:#8B96AC; --complete-soft:rgba(139,150,172,0.16);
    --notstarted:#5A6584; --notstarted-soft:rgba(90,101,132,0.20);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35); --shadow-md:0 8px 24px rgba(0,0,0,0.4); --shadow-lg:0 24px 64px rgba(0,0,0,0.55);
    --row-stripe:rgba(255,255,255,0.028);
    color-scheme:dark;
  }

  /* ============================= RESET ============================= */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface-0); color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance}
  p{margin:0}
  button{font:inherit; color:inherit}
  input,select,textarea{font:inherit; color:inherit}
  a{color:var(--accent)}
  [hidden]{display:none!important}
  img{max-width:100%}
  ::selection{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.001ms!important; transition-duration:0.001ms!important}
  }
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
  svg{width:16px; height:16px; flex-shrink:0} /* safety-net default; specific rules below override */
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px; border:2px solid var(--surface-0)}

  /* ============================= SHELL ============================= */
  #app{min-height:100vh; padding-bottom:64px}
  .wrap{max-width:2000px; margin:0 auto; padding:0 clamp(16px,2vw,36px)}

  /* ---- header ---- */
  .topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--surface-0) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px clamp(16px,2vw,36px)}
  .brand{display:flex; align-items:center; gap:12px}
  .brand-mark{width:40px; height:40px; border-radius:11px; background:linear-gradient(155deg, var(--accent), var(--accent-strong)); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:0.02em; box-shadow:var(--shadow-sm); flex-shrink:0}
  .brand-text h1{font-size:clamp(1.15rem,1rem + 0.5vw,1.4rem); font-weight:800; letter-spacing:-0.01em}
  .brand-text p{font-size:12.5px; color:var(--ink-muted); margin-top:1px}
  .top-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap}

  /* ---- buttons ---- */
  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:9px; padding:9px 15px; font-size:13.5px; font-weight:600; border:1px solid transparent; cursor:pointer; white-space:nowrap; transition:background .12s,border-color .12s,color .12s,transform .06s}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:15px; height:15px; flex-shrink:0}
  .btn-primary{background:var(--accent); color:var(--on-accent); box-shadow:var(--shadow-sm)}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-secondary{background:var(--surface-1); color:var(--ink); border-color:var(--border-strong)}
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-ghost{background:transparent; color:var(--ink-muted); border-color:transparent}
  .btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
  .btn-danger{background:var(--crit-soft); color:var(--crit); border-color:transparent}
  .btn-danger:hover{background:var(--crit); color:#fff}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px}
  .btn:disabled{opacity:0.45; cursor:not-allowed}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--ink-muted); cursor:pointer}
  .icon-btn:hover{background:var(--surface-2); color:var(--ink)}
  .icon-btn svg{width:16px; height:16px}

  /* ---- top split: KPI strip (left) + Morning Roundup (right), 50/50 on one line ---- */
  .top-split{display:flex; gap:16px; align-items:stretch; padding:18px clamp(16px,2vw,36px) 6px}
  .top-split-left, .top-split-right{flex:1 1 0%; min-width:0; display:flex; flex-direction:column; gap:16px}
  @media (max-width:900px){
    .top-split{flex-direction:column; align-items:flex-start}
  }

  /* ---- KPI strip ---- */
  .kpi-strip{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .kpi-tile{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); min-width:0; position:relative}
  .kpi-tile.open{z-index:8}
  .kpi-tile-trigger{all:unset; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; width:100%; padding:16px 18px; cursor:pointer; border-radius:14px}
  .kpi-tile-trigger:hover{background:var(--surface-2)}
  .kpi-tile-trigger:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .kpi-label{font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; gap:5px}
  .kpi-chev{color:var(--ink-faint); flex-shrink:0; transition:transform .15s}
  .kpi-chev.open{transform:rotate(180deg); color:var(--accent)}
  .kpi-value{font-family:var(--font-display); font-weight:800; font-size:clamp(1.6rem,1.3rem + 1vw,2.15rem); line-height:1; font-variant-numeric:tabular-nums}
  .kpi-context{font-size:12.5px; color:var(--ink-muted)}
  .kpi-tile.tone-good .kpi-value{color:var(--good)}
  .kpi-tile.tone-warn .kpi-value{color:var(--warn)}
  .kpi-tile.tone-crit .kpi-value{color:var(--crit)}

  /* ---- Digital clock ---- */
  .clock-card{flex-shrink:0; min-height:120px; background:var(--surface-1); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px; text-align:center}
  .clock-card-icon{color:var(--ink-faint); width:18px; height:18px; margin-bottom:2px}
  .clock-time{font-family:var(--font-display); font-weight:800; font-size:clamp(2rem,1.3rem + 3vw,3.4rem); line-height:1; letter-spacing:0.01em; color:var(--ink)}
  .clock-meta{font-size:clamp(1.05rem,0.85rem + 0.7vw,1.5rem); font-weight:600; color:var(--ink-muted); display:flex; align-items:center; gap:8px}
  .clock-dot{color:var(--ink-faint)}

  /* ---- Unreviewed documents window ---- */
  .unreviewed-panel{flex:1; min-height:160px; margin:0; border:1px solid var(--border-strong); display:flex; flex-direction:column}
  .unreviewed-head{display:flex; align-items:center; gap:12px; padding:15px 18px; flex-shrink:0}
  .unreviewed-head-icon{width:34px; height:34px; border-radius:10px; background:var(--surface-2); color:var(--warn); display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .unreviewed-head-icon svg{width:18px; height:18px}
  .unreviewed-head-text{flex:1; min-width:0}
  .unreviewed-head-text h2{font-size:15.5px; font-weight:800}
  .unreviewed-head-text p{font-size:12.5px; color:var(--ink-muted); margin-top:2px}
  .unreviewed-body{flex:1; min-height:0; max-height:367px; overflow-y:auto; padding:2px 18px 14px; border-top:1px solid var(--border)}
  .unreviewed-doc-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border)}
  .unreviewed-body .unreviewed-doc-row:first-child{border-top:none}
  .unreviewed-doc-link{all:unset; box-sizing:border-box; flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; cursor:pointer}
  .unreviewed-doc-link:hover .unreviewed-doc-name{color:var(--accent)}
  .unreviewed-doc-name{font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .unreviewed-doc-name svg{flex-shrink:0; color:var(--ink-faint)}
  .unreviewed-doc-sub{font-size:12px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .unreviewed-doc-date{font-size:11.5px; font-family:var(--font-mono); color:var(--ink-faint); flex-shrink:0}
  .unreviewed-empty{display:flex; align-items:center; gap:8px; padding:14px 0 6px; font-size:13px; color:var(--ink-muted)}
  .unreviewed-empty svg{color:var(--good); width:16px; height:16px; flex-shrink:0}
  .kpi-tile.tone-accent .kpi-value{color:var(--accent)}
  .kpi-popover{position:absolute; top:calc(100% + 6px); left:0; right:0; min-width:240px; max-height:280px; overflow-y:auto; background:var(--surface-1); border:1px solid var(--border-strong); border-radius:12px; box-shadow:var(--shadow-md); padding:6px; z-index:9; animation:kpiPopIn .12s ease forwards}
  @keyframes kpiPopIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:translateY(0)}}
  .kpi-popover-list{display:flex; flex-direction:column}
  .kpi-popover-row{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px; border-radius:8px; cursor:pointer}
  .kpi-popover-row:hover{background:var(--surface-2)}
  .kpi-popover-row:hover .kpi-popover-row-primary{color:var(--accent)}
  .kpi-popover-row-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
  .kpi-popover-row-primary{font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .kpi-popover-row-secondary{font-size:11.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .kpi-popover-row-date{font-size:11px; font-family:var(--font-mono); color:var(--ink-faint); flex-shrink:0}
  .kpi-popover-empty{display:flex; align-items:center; gap:8px; padding:10px 9px; font-size:12.5px; color:var(--ink-muted)}
  .kpi-popover-empty svg{color:var(--good); width:14px; height:14px; flex-shrink:0}

  /* ---- toolbar ---- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px clamp(16px,2vw,36px)}
  .seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px; border:1px solid var(--border)}
  .seg button{border:none; background:transparent; padding:6.5px 13px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px}
  .seg button svg{width:14px; height:14px; flex-shrink:0}
  .seg button.active{background:var(--surface-1); color:var(--ink); box-shadow:var(--shadow-sm)}
  .seg-icon button{padding:6.5px 9px}
  .seg-icon button svg{margin:0}
  .search-box{position:relative; flex:1; min-width:180px; max-width:340px}
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint)}
  .search-box input{width:100%; padding:8.5px 12px 8.5px 33px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-1); color:var(--ink); font-size:13.5px}
  .search-box input::placeholder{color:var(--ink-faint)}
  .chip-filter{display:inline-flex; align-items:center; gap:6px; padding:6.5px 12px; border-radius:99px; border:1px solid var(--border-strong); background:var(--surface-1); font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; white-space:nowrap}
  .chip-filter .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0}
  .chip-filter.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .toolbar select{padding:8px 12px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-1); color:var(--ink); font-size:13px}
  .toolbar-spacer{flex:1}
  .filter-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}

  /* ---- panel/card base ---- */
  .panel{background:var(--surface-1); border:1px solid var(--border); border-radius:16px; margin:0 clamp(16px,2vw,36px); box-shadow:var(--shadow-sm); overflow:hidden}

  /* ============================= TIMELINE ============================= */
  .tl-legend{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface-1); font-size:11.5px; color:var(--ink-muted)}
  .tl-legend-item{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .tl-legend-swatch{width:9px; height:9px; border-radius:2.5px; flex-shrink:0}
  .tl-legend-icon{width:13px; height:13px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0}
  .tl-legend-icon svg{width:8px; height:8px}
  .tl-legend-sep{width:1px; height:13px; background:var(--border-strong); flex-shrink:0}
  .tl-scroll{overflow-x:auto}
  .tl-inner{min-width:900px}
  .tl-header{display:grid; grid-template-columns:300px 1fr; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface-1); z-index:5}
  .tl-header-label{padding:12px 16px; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; border-right:1px solid var(--border)}
  .tl-header-track{position:relative; height:38px}
  .tl-month{position:absolute; top:0; bottom:0; border-left:1px solid var(--border); display:flex; align-items:center; padding-left:8px; font-size:11.5px; font-weight:600; color:var(--ink-faint); font-family:var(--font-mono)}
  .tl-body{position:relative}
  .tl-group{border-bottom:1px solid var(--border)}
  .tl-group:last-child{border-bottom:none}
  .tl-group-header{display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--surface-2); cursor:pointer; user-select:none}
  .tl-group-header:hover{background:var(--surface-3)}
  .tl-group-header svg.chev{width:14px; height:14px; color:var(--ink-faint); transition:transform .15s; flex-shrink:0}
  .tl-group.collapsed .chev{transform:rotate(-90deg)}
  .tl-group-name{font-weight:700; font-size:13.5px}
  .tl-group-meta{font-size:12px; color:var(--ink-muted); display:flex; align-items:center; gap:10px; margin-left:auto}
  .industry-chip{font-size:11px; font-weight:600; color:var(--ink-muted); background:var(--surface-1); border:1px solid var(--border); padding:2px 8px; border-radius:99px}
  .tl-rows{}
  .tl-group.collapsed .tl-rows{display:none}
  .tl-row{display:grid; grid-template-columns:300px 1fr; border-top:1px solid var(--border); min-height:52px}
  .tl-row:nth-of-type(even){background:var(--row-stripe)}
  .tl-row-label{padding:9px 16px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0}
  .tl-row-title{font-size:13px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tl-row-title:hover{color:var(--accent)}
  .tl-row-sub{font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:6px}
  .owner-avatar{width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:800; color:#fff; flex-shrink:0; letter-spacing:0}
  .tl-row-track{position:relative; padding:10px 0}
  .tl-gridline{position:absolute; top:0; bottom:0; border-left:1px solid var(--border); opacity:0.6}
  .tl-today{position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--accent); z-index:3}
  .tl-today-tag{position:absolute; top:-19px; left:4px; font-size:9.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:1px 5px; border-radius:4px; white-space:nowrap; font-family:var(--font-mono)}
  .bar{position:absolute; top:11px; height:22px; cursor:pointer; min-width:6px}
  .bar-inner{position:absolute; inset:0; border-radius:5px; overflow:hidden; box-shadow:var(--shadow-sm)}
  .bar-fill{position:absolute; inset:0; opacity:0.32}
  .bar-progress{position:absolute; left:0; top:0; bottom:0; opacity:0.95}
  .bar-border{position:absolute; inset:0; border-radius:5px; border:2px solid currentColor; pointer-events:none}
  .bar-label{position:absolute; inset:0; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
  .bar-alert{position:absolute; top:50%; right:-8px; transform:translateY(-50%); width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 0 0 2.5px var(--surface-1), var(--shadow-sm); z-index:6; cursor:pointer}
  .bar-alert svg{width:10px; height:10px}
  .bar-alert.pulse{animation:alertPulse 2s ease-in-out infinite}
  @keyframes alertPulse{0%,100%{box-shadow:0 0 0 2.5px var(--surface-1), 0 0 0 2.5px var(--surface-1)}50%{box-shadow:0 0 0 2.5px var(--surface-1), 0 0 0 6px currentColor}}
  .ms-marker{position:absolute; top:2px; width:13px; height:13px; transform:translateX(-50%) rotate(45deg); border-radius:3px; border:2px solid var(--surface-1); cursor:pointer; z-index:4; box-shadow:var(--shadow-sm)}
  .ms-marker.overdue{width:15px; height:15px; top:1px}
  .tl-empty{padding:64px 24px; text-align:center; color:var(--ink-muted)}
  .tl-empty h3{font-size:16px; margin-bottom:6px; color:var(--ink)}
  .tl-empty p{font-size:13.5px; max-width:380px; margin:0 auto 18px}

  /* ---- status tokens ---- */
  .status-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700}
  .status-pill svg{width:11px; height:11px}
  .st-on-track{background:var(--good-soft); color:var(--good)}
  .st-at-risk{background:var(--warn-soft); color:var(--warn)}
  .st-delayed{background:var(--crit-soft); color:var(--crit)}
  .st-complete{background:var(--complete-soft); color:var(--complete)}
  .st-not-started{background:var(--notstarted-soft); color:var(--notstarted)}

  /* ============================= ROSTER ============================= */
  .roster-list{}
  .roster-card{border-top:1px solid var(--border)}
  .roster-card:first-child{border-top:none}
  .roster-head{display:flex; align-items:flex-start; gap:14px; padding:18px 20px; cursor:pointer}
  .roster-head:hover{background:var(--surface-2)}
  .roster-avatar{width:44px; height:44px; border-radius:11px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:16px; flex-shrink:0}
  .roster-info{flex:1; min-width:0}
  .roster-info h3{font-size:15px; font-weight:700}
  .roster-info .meta-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:5px; font-size:12.5px; color:var(--ink-muted)}
  .roster-stats{display:flex; gap:22px; align-items:center; flex-shrink:0}
  .roster-stat{text-align:right}
  .roster-stat .n{font-family:var(--font-display); font-weight:800; font-size:19px}
  .roster-stat .l{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em}
  .roster-detail{padding:0 20px 20px 78px; display:grid; grid-template-columns:1fr 1fr; gap:20px}
  .roster-card.collapsed .roster-detail{display:none}
  .roster-head .chev{width:15px; height:15px; color:var(--ink-faint); margin-top:14px; transition:transform .15s; flex-shrink:0}
  .roster-card.collapsed .chev{transform:rotate(-90deg)}
  .contact-block h4, .eng-block h4{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-bottom:10px}
  .contact-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--border)}
  .contact-item:first-child{border-top:none}
  .contact-item .ci-icon{width:28px; height:28px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); flex-shrink:0}
  .contact-item .ci-icon svg{width:14px; height:14px}
  .contact-name{font-size:13px; font-weight:600}
  .contact-title{font-size:11.5px; color:var(--ink-muted)}
  .contact-links{display:flex; gap:10px; margin-top:3px; font-size:11.5px}
  .contact-links a{color:var(--ink-muted); text-decoration:none}
  .contact-links a:hover{color:var(--accent); text-decoration:underline}
  .primary-badge{font-size:9.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:99px; margin-left:6px; vertical-align:1px}
  .files-block{margin-top:14px; padding-top:14px; border-top:1px solid var(--border)}
  .files-link{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none; padding:8px 11px; border-radius:9px; background:var(--accent-soft)}
  .files-link:hover{text-decoration:underline}
  .files-link svg:last-child{width:11px; height:11px; opacity:0.7}
  .files-quicklink{color:var(--accent)}
  .portal-block{margin-top:14px; padding-top:14px; border-top:1px solid var(--border)}
  .portal-link{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--on-accent); text-decoration:none; padding:9px 14px; border-radius:9px; background:var(--accent)}
  .portal-link:hover{background:var(--accent-strong)}
  .portal-link svg:last-child{width:11px; height:11px; opacity:0.85}
  .portal-quicklink{color:var(--accent)}
  .newdocs-banner{display:flex; align-items:center; gap:9px; margin-top:10px; padding:9px 12px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; font-weight:600}
  .newdocs-banner svg{flex-shrink:0}
  .newdocs-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .newdocs-dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--warn); border:2px solid var(--surface-1)}
  .portal-url-row{margin-top:6px}
  .portal-url-field{width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-muted); font-family:var(--font-mono); font-size:12px}
  .portal-files-list{margin-top:14px; display:flex; flex-direction:column; gap:2px}
  .portal-file-row{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px}
  .portal-file-row:last-child{border-bottom:none}
  .portal-file-row.is-reviewed{opacity:.62}
  .portal-file-reviewed{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.02em; cursor:pointer; user-select:none; flex-shrink:0}
  .portal-file-reviewed input[type="checkbox"]{width:14px; height:14px; margin:0; accent-color:var(--accent); cursor:pointer}
  .portal-file-reviewed input[type="checkbox"]:disabled{cursor:default}
  .portal-file-name{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-weight:600}
  .portal-file-name:hover{text-decoration:underline}
  .portal-file-meta{color:var(--ink-faint); font-size:11.5px; font-family:var(--font-mono)}
  .portal-file-note{width:100%; color:var(--ink-muted); font-size:12px; font-style:italic}
  .eng-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); cursor:pointer}
  .eng-item:first-child{border-top:none}
  .eng-item:hover .eng-title{color:var(--accent)}
  .eng-title{font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .eng-alert-badge{flex-shrink:0; display:inline-flex}
  .eng-alert-badge svg{width:12px; height:12px}
  .eng-dates{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); flex-shrink:0}
  .empty-note{font-size:12.5px; color:var(--ink-faint); font-style:italic}

  /* ============================= DRAWER ============================= */
  .overlay{position:fixed; inset:0; background:rgba(10,14,26,0.42); z-index:40; opacity:0; animation:fadeIn .15s ease forwards}
  @keyframes fadeIn{to{opacity:1}}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(440px,92vw); background:var(--surface-1); box-shadow:var(--shadow-lg); z-index:41; display:flex; flex-direction:column; transform:translateX(100%); animation:slideIn .18s ease forwards}
  @keyframes slideIn{to{transform:translateX(0)}}
  .drawer-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 20px 16px; border-bottom:1px solid var(--border)}
  .drawer-head h2{font-size:17px; font-weight:700; line-height:1.3}
  .drawer-head .sub{font-size:12.5px; color:var(--ink-muted); margin-top:4px}
  .drawer-callout{display:flex; align-items:center; gap:10px; padding:11px 20px; font-size:13px; font-weight:600}
  .drawer-callout-icon{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0}
  .drawer-callout-icon svg{width:12px; height:12px}
  .drawer-body{flex:1; overflow-y:auto; padding:18px 20px}
  .drawer-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px}
  .field-group{margin-bottom:20px}
  .field-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:8px; display:block}
  .status-chip-row{display:flex; gap:6px; flex-wrap:wrap}
  .status-chip-row button{border:1.5px solid var(--border-strong); background:var(--surface-1); padding:6px 11px; border-radius:99px; font-size:12px; font-weight:600; color:var(--ink-muted); cursor:pointer; display:inline-flex; align-items:center; gap:5px}
  .status-chip-row button svg{width:11px;height:11px}
  .status-chip-row button.sel.opt-on-track{background:var(--good-soft); border-color:var(--good); color:var(--good)}
  .status-chip-row button.sel.opt-at-risk{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
  .status-chip-row button.sel.opt-delayed{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
  .status-chip-row button.sel.opt-complete{background:var(--complete-soft); border-color:var(--complete); color:var(--complete)}
  .status-chip-row button.sel.opt-not-started{background:var(--notstarted-soft); border-color:var(--notstarted); color:var(--notstarted)}
  .progress-row{display:flex; align-items:center; gap:12px}
  .progress-row input[type=range]{flex:1; accent-color:var(--accent)}
  .progress-row .pv{font-family:var(--font-mono); font-weight:600; font-size:13px; width:42px; text-align:right}
  .meta-line{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-top:1px solid var(--border)}
  .meta-line:first-child{border-top:none}
  .meta-line .k{color:var(--ink-muted)}
  .meta-line .v{font-weight:600; text-align:right}
  .ms-list{}
  .ms-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border)}
  .ms-row:first-child{border-top:none}
  .ms-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border-strong); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface-1)}
  .ms-check svg{width:12px; height:12px; opacity:0}
  .ms-row.done .ms-check{background:var(--good); border-color:var(--good)}
  .ms-row.done .ms-check svg{opacity:1; color:#fff}
  .ms-row.overdue .ms-check{border-color:var(--crit)}
  .ms-name{flex:1; min-width:0; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ms-row.done .ms-name{text-decoration:line-through; color:var(--ink-faint)}
  .ms-date{font-size:11.5px; font-family:var(--font-mono); color:var(--ink-muted); flex-shrink:0}
  .ms-row.overdue .ms-date{color:var(--crit); font-weight:600}
  .ms-del{flex-shrink:0}
  .add-ms-form{display:flex; gap:8px; margin-top:10px}
  .add-ms-form input[type=text]{flex:1}
  .add-ms-form input[type=date]{width:150px}

  /* ============================= FORMS / MODAL ============================= */
  .modal-overlay{position:fixed; inset:0; background:rgba(10,14,26,0.48); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; animation:fadeIn .15s ease forwards}
  .modal{background:var(--surface-1); border-radius:18px; width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); transform:translateY(8px) scale(0.98); animation:popIn .16s ease forwards; overflow:hidden}
  @keyframes popIn{to{transform:translateY(0) scale(1)}}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; padding:20px 22px 14px; border-bottom:1px solid var(--border); flex-shrink:0}
  .modal-head h2{font-size:17px; font-weight:700}
  .modal-head p{font-size:12.5px; color:var(--ink-muted); margin-top:4px}
  .modal form{display:flex; flex-direction:column; min-height:0; flex:1 1 auto}
  .modal-body{padding:18px 22px; overflow-y:auto; flex:1 1 auto; min-height:0}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-shrink:0}
  .form-row{margin-bottom:16px}
  .form-row label{display:block; font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:6px}
  .form-row .req{color:var(--crit)}
  .form-row input[type=text],.form-row input[type=email],.form-row input[type=tel],.form-row input[type=url],.form-row input[type=date],.form-row input[type=number],.form-row select,.form-row textarea{
    width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-3); color:var(--ink); font-size:13.5px;
  }
  .form-row textarea{resize:vertical; min-height:60px}
  .form-hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.4}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .dyn-row{border:1px solid var(--border); border-radius:11px; padding:12px; margin-bottom:10px; position:relative; background:var(--surface-2)}
  .dyn-row .dyn-remove{position:absolute; top:8px; right:8px}
  .dyn-row-title{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px}
  .add-row-btn{width:100%; border:1.5px dashed var(--border-strong); background:transparent; border-radius:10px; padding:10px; font-size:13px; font-weight:600; color:var(--ink-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px}
  .add-row-btn svg{width:14px; height:14px; flex-shrink:0}
  .add-row-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .ms-inline-row{display:grid; grid-template-columns:1fr 130px auto; gap:8px; align-items:center; margin-bottom:8px}
  .link-inline-row{display:grid; grid-template-columns:1fr 1.6fr auto; gap:8px; align-items:center; margin-bottom:8px}
  .cf-inline-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px}
  .eng-links-list{display:flex; flex-direction:column; gap:8px; align-items:flex-start}

  /* ============================= TOOLTIP / TOAST ============================= */
  .tooltip{position:fixed; z-index:60; background:var(--ink); color:var(--surface-1); padding:9px 12px; border-radius:9px; font-size:12px; max-width:260px; box-shadow:var(--shadow-md); pointer-events:none; line-height:1.4}
  :root[data-theme="dark"] .tooltip, :root:not([data-theme="light"]) .tooltip{}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tooltip{background:var(--surface-3); color:var(--ink); border:1px solid var(--border-strong)} }
  :root[data-theme="dark"] .tooltip{background:var(--surface-3); color:var(--ink); border:1px solid var(--border-strong)}
  .tooltip b{display:block; font-weight:700; margin-bottom:2px}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface-1); padding:11px 18px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); z-index:70; display:flex; align-items:center; gap:8px}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border-strong)} }
  :root[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border-strong)}
  .banner{margin:0 clamp(16px,2vw,36px) 14px; padding:11px 16px; border-radius:11px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px}
  .banner svg{width:15px; height:15px; flex-shrink:0}

  /* ============================= MORNING ROUNDUP ============================= */
  .roundup-panel{margin:0; border:1px solid var(--border-strong)}
  .roundup-head{display:flex; align-items:center; gap:12px; padding:15px 18px; cursor:pointer; user-select:none}
  .roundup-head:hover{background:var(--surface-2)}
  .roundup-head-icon{width:34px; height:34px; border-radius:10px; background:linear-gradient(155deg,var(--accent),var(--accent-strong)); color:var(--on-accent); display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .roundup-head-icon svg{width:18px; height:18px}
  .roundup-head-text{flex:1; min-width:0}
  .roundup-head-text h2{font-size:15.5px; font-weight:800}
  .roundup-head-text p{font-size:12.5px; color:var(--ink-muted); margin-top:2px}
  .roundup-chev{transition:transform .15s}
  .roundup-chev.collapsed{transform:rotate(-90deg)}
  .roundup-body{padding:2px 18px 16px; border-top:1px solid var(--border)}
  .roundup-section{margin-top:12px}
  .roundup-section-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); display:flex; align-items:center; gap:6px; padding:8px 0 2px}
  .roundup-section-title.tone-crit{color:var(--crit)}
  .roundup-section-title.tone-warn{color:var(--warn)}
  .roundup-section-title.tone-accent{color:var(--accent)}
  .roundup-count{background:var(--surface-2); color:var(--ink-muted); border-radius:99px; padding:1px 7px; font-size:10.5px; font-weight:700}
  .roundup-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border)}
  .roundup-section .roundup-row:first-of-type{border-top:none}
  .roundup-row-link{cursor:pointer}
  .roundup-row-link:hover .roundup-title{color:var(--accent)}
  .roundup-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border-strong); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface-1); color:transparent}
  .roundup-check:hover{border-color:var(--accent); color:var(--accent)}
  .roundup-check svg{width:12px; height:12px}
  .roundup-type-icon{width:24px; height:24px; border-radius:7px; background:var(--surface-2); color:var(--ink-muted); display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .roundup-text{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
  .roundup-title{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .roundup-sub{font-size:12px; color:var(--ink-muted); flex-shrink:0}
  .roundup-date{font-size:11.5px; font-family:var(--font-mono); color:var(--ink-faint); flex-shrink:0}
  .roundup-del{flex-shrink:0; width:26px; height:26px}
  .roundup-empty{display:flex; align-items:center; gap:8px; padding:14px 0 6px; font-size:13px; color:var(--ink-muted)}
  .roundup-empty svg{color:var(--good); width:16px; height:16px}
  .roundup-quickadd{display:flex; flex-wrap:nowrap; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border)}
  .roundup-quickadd select, .roundup-quickadd input[type=date]{flex:0 0 auto; padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-3); color:var(--ink); font-size:12.5px}
  .roundup-quickadd input[type=text]{flex:1 1 0%; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-3); color:var(--ink); font-size:12.5px}

  .drawer-notes-text{font-size:13px; color:var(--ink-muted); white-space:pre-wrap; line-height:1.5; margin:0; overflow-wrap:anywhere}

  /* ============================= FLOATING NOTES WINDOW ============================= */
  .notes-float{position:fixed; width:320px; max-width:calc(100vw - 32px); background:var(--surface-1); border:1px solid var(--border-strong); border-radius:14px; box-shadow:var(--shadow-lg); z-index:45; display:flex; flex-direction:column; overflow:hidden}
  .notes-float-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 6px 9px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); cursor:grab; user-select:none}
  .notes-float-head:active{cursor:grabbing}
  .notes-float-title{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; min-width:0; overflow:hidden}
  .notes-float-title svg{color:var(--ink-faint); flex-shrink:0}
  .notes-float-title>span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .notes-float-sub{font-weight:500; color:var(--ink-muted)}
  .notes-float-actions{display:flex; gap:2px; flex-shrink:0}
  .notes-float-actions .icon-btn{width:26px; height:26px}
  .notes-float-body{padding:12px 14px; max-height:min(50vh,360px); overflow-y:auto}
  .notes-float-text{font-size:13px; color:var(--ink); white-space:pre-wrap; line-height:1.5; margin:0; overflow-wrap:anywhere}
  .notes-float-body textarea{width:100%; min-height:140px; resize:vertical; padding:9px 11px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-3); color:var(--ink); font-size:13px; font-family:inherit}
  .notes-float-foot{display:flex; justify-content:flex-end; gap:8px; padding:10px 14px; border-top:1px solid var(--border)}

  @media (max-width:1100px){
    .roster-detail{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="notes-popup-root"></div>
<div id="toast-root"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
